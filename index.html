<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="side">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      Study planner
    </div>

    <div class="hello">
      <h1 id="greeting">Hello</h1>
      <p class="date" id="today"></p>
      <p class="summary" id="summary"></p>
    </div>

    <div class="glance">
      <div class="ring" id="ring" role="img" aria-label="0% of tasks done">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="10"/>
          <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round"/>
        </svg>
        <div class="ring-label"><b id="ringPct">0%</b><span>complete</span></div>
      </div>
      <dl class="stats">
        <div class="stat"><dt>Open</dt><dd id="statOpen">0</dd></div>
        <div class="stat"><dt>Due today</dt><dd id="statToday">0</dd></div>
        <div class="stat" id="statOverdueBox"><dt>Overdue</dt><dd id="statOverdue">0</dd></div>
      </dl>
    </div>

    <nav class="courses" aria-label="Courses">
      <p class="side-h">Courses</p>
      <div id="courseList"></div>
    </nav>

    <button type="button" class="theme-btn" id="themeBtn"></button>
  </aside>

  <!-- Main -->
  <main class="main">
    <form class="composer" id="form" novalidate>
      <p class="composer-h" id="formHeading">New task</p>
      <div class="c-top">
        <label class="sr" for="title">Task</label>
        <input class="input big" type="text" id="title" maxlength="140" autocomplete="off" placeholder="What do you need to get done?" aria-describedby="titleError">
        <button type="submit" class="primary" id="submitBtn">Add task</button>
      </div>
      <p class="error" id="titleError" role="alert" hidden>Enter a task title.</p>

      <div class="c-opts">
        <label class="opt">
          <span class="opt-label">Course</span>
          <input class="input" type="text" id="course" list="courses" maxlength="40" autocomplete="off" placeholder="e.g. Calculus II">
        </label>
        <datalist id="courses"></datalist>
        <label class="opt">
          <span class="opt-label">Due date</span>
          <input class="input" type="date" id="due">
        </label>
        <div class="opt">
          <span class="opt-label" id="priLabel">Priority</span>
          <div class="seg" role="radiogroup" aria-labelledby="priLabel">
            <label data-p="high"><input type="radio" name="priority" value="high"><span>High</span></label>
            <label data-p="medium"><input type="radio" name="priority" value="medium" checked><span>Medium</span></label>
            <label data-p="low"><input type="radio" name="priority" value="low"><span>Low</span></label>
          </div>
        </div>
        <button type="button" class="ghost" id="cancelBtn" hidden>Cancel edit</button>
      </div>
    </form>

    <div class="bar">
      <div class="tabs" id="tabs">
        <button type="button" class="tab" data-filter="all" aria-pressed="true">All<span class="n"></span></button>
        <button type="button" class="tab" data-filter="today" aria-pressed="false">Today<span class="n"></span></button>
        <button type="button" class="tab" data-filter="upcoming" aria-pressed="false">Upcoming<span class="n"></span></button>
        <button type="button" class="tab" data-filter="overdue" aria-pressed="false">Overdue<span class="n"></span></button>
        <button type="button" class="tab" data-filter="done" aria-pressed="false">Done<span class="n"></span></button>
      </div>
      <div class="search">
        <span class="s-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <label class="sr" for="search">Search tasks</label>
        <input class="input" type="text" id="search" placeholder="Search tasks" autocomplete="off">
      </div>
    </div>

    <div id="list"></div>

    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 120 96" width="120" height="96" aria-hidden="true">
        <rect x="24" y="8" width="72" height="80" rx="12" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
        <rect x="38" y="26" width="30" height="6" rx="3" fill="var(--line)"/>
        <rect x="38" y="42" width="44" height="6" rx="3" fill="var(--line)"/>
        <rect x="38" y="58" width="24" height="6" rx="3" fill="var(--line)"/>
        <circle cx="88" cy="70" r="16" fill="#FFE45C"/>
        <path d="M80 70l6 6 11-12" fill="none" stroke="#1B1A3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="empty-title" id="emptyTitle"></p>
      <p class="empty-sub" id="emptySub"></p>
    </div>

    <div class="foot">
      <span id="footInfo"></span>
      <button type="button" class="link" id="clearDone" hidden>Clear completed</button>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" hidden>
  <p id="toastMsg"></p>
  <button type="button" id="undoBtn">Undo</button>
</div>

<script src="script.js"></script>
</body>
</html>
